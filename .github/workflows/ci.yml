name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Typecheck
        run: npx turbo typecheck

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          additional_files: start.sh
          ignore_paths: node_modules

      - name: Actionlint
        uses: raven-actions/actionlint@v2

  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build all packages
        run: npx turbo build

  docs:
    name: Docs & spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: cspell.json
          files: "**/*.md"
          strict: true

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: .github/mlc-config.json
          use-quiet-mode: yes
          folder-path: .
          file-extension: .md

  garden:
    name: Garden lint (packs/registry/prompts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Garden drift + size-cap lint (FRW-BL-067)
        run: node scripts/garden-lint.mjs

      - name: Plugin manifest validation (FRW-BL-041)
        run: node framework/plugin/validate-plugin.mjs

      # FRW-BL-107: hooks are correct code that can be wired to nothing, and every handler test
      # passes while that is true. This audits the WIRING: matcher tool names, unguarded capability
      # siblings, hooks reading fields their matched tools never send, manifest parity, and one
      # script registered under two hook events with no hook_event_name discriminator.
      # Warns (exit 0) on an unrecognised tool name so a platform update cannot wedge the suite.
      - name: Hook configuration audit (FRW-BL-107)
        run: node scripts/hook-config-audit.mjs

  calibration:
    name: Judge calibration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # FRW-BL-087: the judge prompt is a versioned artifact. --check fails on metric drift
      # beyond threshold AND on a prompt whose sha256 no longer matches the recordings, so an
      # edit to card-reviewer.md cannot silently invalidate the calibration corpus.
      - name: Judge calibration drift gate (FRW-BL-087)
        run: node scripts/judge-calibration.mjs --check

  selftest:
    name: Framework self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # FRW-BL-081: discover and run EVERY self-test. These are dependency-free
      # by design and self-report via exit code. Do NOT narrow this glob to make
      # the job green — a failing self-test is a finding, not a glob problem.
      - name: Run all framework self-tests
        run: |
          set -uo pipefail
          fail=0
          count=0
          while IFS= read -r t; do
            count=$((count + 1))
            echo "::group::$t"
            if node "$t"; then
              echo "PASS $t"
            else
              echo "::error file=$t::self-test failed"
              fail=$((fail + 1))
            fi
            echo "::endgroup::"
          done < <(find framework scripts .claude/hooks \
                     \( -name '*.test.mjs' -o -name '*.test.js' \) \
                     -not -path '*/node_modules/*' | sort)
          echo "---"
          echo "$count self-tests run, $fail failed"
          if [ "$count" -eq 0 ]; then
            echo "::error::no self-tests discovered — the glob is broken"
            exit 1
          fi
          exit "$fail"
